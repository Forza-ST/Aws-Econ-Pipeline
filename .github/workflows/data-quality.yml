# ── Data Quality Check: runs on schedule and on-demand ────────────────────
name: Data Quality — Great Expectations

on:
  schedule:
    - cron: "0 8 * * 1-5"   # weekdays 8am UTC (after overnight ingestion)
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  quality-check:
    name: Run GE Checkpoints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install great_expectations boto3 pandas pyarrow
      - name: Run checkpoints
        run: python scripts/run_ge_checkpoints.py
        env:
          S3_BUCKET_CLEAN: ${{ secrets.S3_BUCKET_CLEAN }}
          ENVIRONMENT: ${{ vars.ENVIRONMENT }}
      - name: Upload GE docs to S3
        if: always()
        run: |
          aws s3 sync configs/great_expectations/uncommitted/data_docs/ \
            s3://${{ secrets.S3_BUCKET_CLEAN }}/data-docs/ --delete

# ── CI Pipeline: runs on every PR and push to main ─────────────────────────
name: CI — Lint, Test, Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read          # least-privilege: read-only on repo content
  security-events: write  # needed for SARIF upload (CodeQL / gitleaks)

jobs:
  # ── 1. Secret scanning — catches leaked keys before anything else ─────────
  secret-scan:
    name: Secret Scan (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so gitleaks can scan all commits
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 2. Lint & format ─────────────────────────────────────────────────────
  lint:
    name: Lint (Ruff + Black)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install ruff black
      - run: ruff check src/ tests/
      - run: black --check src/ tests/

  # ── 3. Unit tests ─────────────────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Run pytest
        run: pytest tests/unit/ -v --tb=short --cov=src --cov-report=xml
        env:
          # Use dummy values in tests — no real credentials ever in CI env vars
          AWS_REGION: us-east-1
          ENVIRONMENT: test
      - uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ── 4. Terraform validate (no plan — avoids needing live AWS creds in CI) ─
  terraform-validate:
    name: Terraform Validate
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
      - name: Validate dev environment
        run: |
          cd infrastructure/terraform/environments/dev
          terraform init -backend=false
          terraform validate
      - name: Check formatting
        run: terraform fmt -check -recursive infrastructure/

  # ── 5. Dependency vulnerability scan ─────────────────────────────────────
  dependency-scan:
    name: Dependency Scan (pip-audit)
    runs-on: ubuntu-latest
    needs: secret-scan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pip-audit
      - run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969

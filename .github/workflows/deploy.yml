# ── Deploy Pipeline: runs on merge to main only ────────────────────────────
name: Deploy — Terraform + Lambda Package

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: dev
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write   # required for OIDC (no long-lived AWS keys stored in GitHub)

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.environment || 'dev' }}
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'dev' }}  # uses GitHub Environments for approval gates

    steps:
      - uses: actions/checkout@v4

      # OIDC-based auth — no AWS_ACCESS_KEY_ID or AWS_SECRET_ACCESS_KEY stored in GitHub
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: github-actions-deploy

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # Slim zip: boto3 + requests only; heavy deps live in Lambda Layer
      - name: Package Lambda collectors (slim — no heavy deps)
        run: |
          mkdir -p lambda_package/utils
          pip install -r requirements-lambda.txt -t lambda_package/ --quiet
          cp src/collectors/*.py lambda_package/
          cp src/utils/*.py lambda_package/utils/
          cd lambda_package
          zip -rq "${GITHUB_WORKSPACE}/lambda_collectors.zip" . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "*.dist-info/*" \
            -x "*.egg-info/*"
          cd ..
          echo "Zip size: $(du -sh lambda_collectors.zip | cut -f1)"
          ls -lh lambda_collectors.zip

      - name: Package dashboard API Lambda (slim — Athena queries only)
        run: |
          mkdir -p api_package
          pip install -r requirements-lambda.txt -t api_package/ --quiet
          cp src/api/dashboard_api.py api_package/
          cd api_package
          zip -rq "${GITHUB_WORKSPACE}/lambda_api.zip" . \
            -x "*.pyc" \
            -x "__pycache__/*" \
            -x "*.dist-info/*"
          cd ..
          echo "API zip size: $(du -sh lambda_api.zip | cut -f1)"
          ls -lh lambda_api.zip

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        env:
          # Override via repo variables TF_STATE_BUCKET / TF_STATE_LOCK_TABLE if needed
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET || 'econ-pipeline-tfstate-dev-967140533377' }}
          TF_STATE_LOCK_TABLE: ${{ vars.TF_STATE_LOCK_TABLE || 'econ-pipeline-tfstate-lock' }}
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=econ-pipeline/${{ github.event.inputs.environment || 'dev' }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -backend-config="dynamodb_table=${TF_STATE_LOCK_TABLE}" \
            -backend-config="encrypt=true"

      - name: Verify Lambda package
        run: |
          ls -la "${GITHUB_WORKSPACE}/lambda_collectors.zip"
          ls -la "${GITHUB_WORKSPACE}/lambda_api.zip"
          unzip -l "${GITHUB_WORKSPACE}/lambda_collectors.zip" | head -20

      - name: Terraform Plan
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
          terraform plan -no-color -refresh=false -out=tfplan \
            -var="lambda_zip_path=${GITHUB_WORKSPACE}/lambda_collectors.zip" \
            -var="api_zip_path=${GITHUB_WORKSPACE}/lambda_api.zip"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        run: |
          cd infrastructure/terraform/environments/${{ github.event.inputs.environment || 'dev' }}
          terraform apply -auto-approve tfplan
